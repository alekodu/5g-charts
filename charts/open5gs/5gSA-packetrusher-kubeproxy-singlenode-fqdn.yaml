# Disable scp
global:
  storageClass: "local-path"
scp:
  enabled: false
# set scp configuration in the other functions:
smf:
  podAnnotations:
    sidecar.istio.io/inject: "false"
  resources:
    requests:
      cpu: 1000m
      memory: 1000Mi
    limits:
      cpu: 1000m
      memory: 1000Mi
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: node
            operator: In
            values:
            - smf
  containerPorts:
    sbi: 80
  services:
    sbi:
      ports:
        sbi: 80
  config:
    logLevel: error
    sbi:
      server:
        #advertise: open5gs-smf-sbi
      client:
        scp:
          enabled: false
          uri: ""
        nrf:
          enabled: true
          uri: http://open5gs-nrf-sbi:80
    pcrf:
      enabled: false
